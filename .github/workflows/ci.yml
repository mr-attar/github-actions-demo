
name: My First CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check HTML file
        run: |
          test -f index.html
          echo "HTML file exists successfully!"

      - name: Validate HTML file
        run: |
          test -s index.html
          echo "HTML validation successful!"
